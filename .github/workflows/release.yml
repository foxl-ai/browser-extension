name: Release

# Builds the reproducible zip and publishes it as a GitHub Release with its
# SHA256SUMS.txt. Hosted runners, as in ci.yml.
#
# Dispatch it after bumping manifest.json's version and adding the matching
# CHANGELOG.md heading:
#   gh workflow run release.yml -f version=X.Y.Z
# The version input is a guard, not the source of truth: it must equal
# manifest.json's version, so a mistyped dispatch fails instead of shipping the
# wrong number.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must equal manifest.json version), e.g. 0.7.0'
        required: true
      publish:
        # A string choice, not a boolean. Submitting is the default: review takes days, but it runs
        # after this workflow ends and never blocks the release, and the store publishes on approval.
        # 'false' leaves a DRAFT in the dashboard instead.
        description: 'Submit to the Chrome Web Store for review after uploading (false = leave a draft).'
        type: choice
        default: 'true'
        options: ['false', 'true']

permissions:
  contents: write # create the release and upload assets

concurrency:
  # The store rejects a second upload of the same version, and two concurrent
  # releases would race for which one is the draft.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The store key is this environment's secret; its deployment rule admits main only.
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check inputs against the manifest and changelog
        run: |
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "${{ inputs.version }}" != "$MANIFEST" ]; then
            echo "::error::input version ${{ inputs.version }} != manifest.json version $MANIFEST"
            exit 1
          fi
          if ! grep -q "## v${MANIFEST} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v${MANIFEST}' heading"
            exit 1
          fi
          if git rev-parse "v${MANIFEST}" >/dev/null 2>&1; then
            echo "::error::tag v${MANIFEST} already exists - bump the version"
            exit 1
          fi

      - name: Audit
        run: node scripts/audit.mjs

      - name: Unit tests
        run: node --test scripts/*.test.mjs

      - name: Build
        run: node scripts/build.mjs

      - name: Tag
        run: |
          git config user.name "Sanghwa Na"
          git config user.email "sanghwa.me@gmail.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      # Body: the changelog section for this version, plus the verification
      # instructions so they sit right next to the download.
      - name: Assemble release notes
        run: |
          {
            awk '/^## v${{ inputs.version }} /{f=1;print;next} /^## v/{if(f)exit} f' CHANGELOG.md
            echo ""
            echo "## Verify the download"
            echo ""
            echo '```sh'
            echo "shasum -a 256 -c SHA256SUMS.txt"
            echo '```'
            echo ""
            echo "Or rebuild it yourself and compare - the zip is byte-reproducible:"
            echo ""
            echo '```sh'
            echo "git checkout v${{ inputs.version }} && node scripts/build.mjs"
            echo "shasum -a 256 dist/foxl-browser-extension-${{ inputs.version }}.zip"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file release-notes.md \
            "dist/foxl-browser-extension-${{ inputs.version }}.zip" \
            "dist/foxl-browser-extension-latest.zip" \
            "dist/SHA256SUMS.txt"

      # THE STORE UPLOAD AND SUBMIT, as the publisher's service account
      # (foxl-cws-publisher@foxl-489707.iam.gserviceaccount.com, added in the Developer Dashboard's
      # Account section; it holds no Google Cloud role). scripts/cws-publish.mjs signs the JWT and
      # calls the v2 API with no dependency, because a dependency that can publish to the store is a
      # supply-chain surface this repo does not need; every wire constant is cited in its header.
      # The key is the `chrome-web-store` environment's secret, which only main can use. Missing
      # configuration SKIPS LOUDLY, naming what is missing, and every unexpected store answer FAILS the
      # step: a skipped or unchecked upload that reads as success is how the listing sat on 0.7.1.
      - name: Upload to the Chrome Web Store and submit for review
        id: cws
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          ZIP: dist/foxl-browser-extension-${{ inputs.version }}.zip
        run: |
          set -euo pipefail
          missing=""
          for k in CWS_SERVICE_ACCOUNT_JSON CWS_PUBLISHER_ID CWS_EXTENSION_ID; do
            [ -n "${!k:-}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "uploaded=skipped" >> "$GITHUB_OUTPUT"
            {
              echo "### Chrome Web Store upload SKIPPED"
              echo ""
              echo "Missing from the chrome-web-store environment:$missing"
              echo ""
              echo "The zip is attached to the GitHub release; RELEASING.md says how the account is set up."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::store upload skipped - missing:$missing"
            exit 0
          fi
          node scripts/cws-publish.mjs upload "$ZIP" "${{ inputs.version }}"
          echo "uploaded=success" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.publish }}" = "true" ]; then
            node scripts/cws-publish.mjs publish
            echo "submitted=true" >> "$GITHUB_OUTPUT"
          else
            echo "uploaded as a DRAFT (publish input was false) - submit from the dashboard or re-run with publish=true."
          fi
          node scripts/cws-publish.mjs status | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          {
            echo "### release ${{ inputs.version }}"
            echo ""
            echo "| step | result |"
            echo "|---|---|"
            echo "| github release | ${{ job.status }} |"
            echo "| store upload | ${{ steps.cws.outputs.uploaded || 'not reached' }} |"
            echo "| submitted for review | ${{ steps.cws.outputs.submitted || 'no' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
