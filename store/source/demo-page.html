<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Foxl example workspace</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#22252a;background:#fff;font:13px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{height:54px;border-bottom:1px solid #e9e9eb;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:12px}
    .wordmark{font-size:16px;font-weight:650;letter-spacing:-.6px}.subnav{color:#777b84;font-size:11px;display:flex;gap:20px}
    main{max-width:820px;margin:0 auto;padding:28px 34px 44px}.kicker{font-size:10px;letter-spacing:1.7px;color:#82848b;font-weight:650;text-transform:uppercase}
    h1{font-size:32px;line-height:1.18;font-weight:570;letter-spacing:-1.3px;margin:12px 0 14px;max-width:560px}
    .intro{font-size:13px;line-height:1.7;color:#767a84;max-width:550px;margin:0 0 18px}.meta{font-size:10px;color:#93959a;margin-bottom:26px}
    h2{font-size:16px;letter-spacing:-.3px;font-weight:620;margin:21px 0 6px}p{color:#646971;margin:0 0 14px}
    .article-grid{display:grid;grid-template-columns:1fr 180px;gap:34px}.note{padding:19px;background:#f5f5f5;border-radius:8px;height:max-content;color:#62656d;font-size:11px;line-height:1.65}
    .note strong{display:block;color:#292d32;margin-bottom:8px;font-size:12px}.rule{height:1px;background:#e9e9eb;margin:22px 0}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.venue{border:1px solid #e5e5e8;border-radius:10px;overflow:hidden;background:#fff}.venue .art{height:94px;background:#e9e9e6;padding:16px 22px;overflow:hidden;position:relative}
    .venue:nth-child(2) .art{background:#e5e7eb}.venue:nth-child(3) .art{background:#e8eae6}
    .windows{height:76px;display:flex;gap:8px}.windows i{flex:1;border:5px solid #d0d2cd;border-bottom:0;background:#f7f8f5;border-radius:30px 30px 0 0}
    .venue:nth-child(2) .windows i{border-radius:2px;border-color:#c6cbd4}.venue:nth-child(3) .windows i{border-color:#c7cec0;background:#f3f6ee}
    .venue-info{padding:14px}.venue h2{font-size:14px;margin:0 0 7px}.venue p{font-size:11px;margin:4px 0}.tag{display:inline-block;background:#f3f4f5;padding:3px 7px;border-radius:4px;font-size:10px;margin-top:6px;color:#63666d}
    .checklist{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;color:#73767d;font-size:11px}.checklist span{border:1px solid #e8e8eb;padding:5px 9px;border-radius:5px}
    form{max-width:575px;margin:22px 0 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}label{display:block;color:#656971;font-size:11px;font-weight:550}input,select{width:100%;padding:9px 11px;margin-top:5px;background:#fff;border:1px solid #dddfe4;border-radius:6px;color:#30343c;font:12px/1.5 inherit;outline:none}.full{grid-column:1/-1}
    button{margin-top:18px;background:#24272d;border:0;border-radius:6px;padding:9px 14px;color:white;font:12px inherit}.form-note{font-size:10px;color:#8a8d93;margin-top:12px}.example{font-size:9px;color:#9b9da3}
    body[data-page="form"] main{padding-top:21px}body[data-page="form"] h1{font-size:28px;margin:9px 0 8px}
    body[data-page="form"] form{margin-top:14px}body[data-page="form"] .form-grid{gap:11px 18px}
    body[data-page="form"] input,body[data-page="form"] select{padding:7px 10px}
    body[data-page="form"] button{margin-top:13px}body[data-page="form"] .form-note{margin-top:8px}
    @media(max-width:520px){header{padding:0 22px}.subnav{gap:12px;font-size:10px}main{padding:24px}h1{font-size:29px}.article-grid{grid-template-columns:1fr;gap:0}.note{display:none}.cards{gap:7px}.venue .art{height:72px;padding:10px}.venue-info{padding:10px}.venue h2{font-size:12px}.form-grid{gap:12px}.venue p{font-size:10px}}
  </style>
</head>
<body>
  <header><div class="wordmark" id="site-name"></div><div class="subnav" id="site-nav"></div></header>
  <main id="page-content"></main>
  <script>
    const fixture = window.captureFixture;
    document.body.dataset.page = fixture.page;
    const content = document.getElementById('page-content');
    if (fixture.page === 'article') {
      document.getElementById('site-name').textContent = 'Fieldnotes';
      document.getElementById('site-nav').innerHTML = '<span>Ideas</span><span>Work</span><span>Reading list</span>';
      content.innerHTML = `
        <div class="kicker">WORK, WITH A LITTLE MORE ROOM</div>
        <h1>A calmer working day starts with fewer loose ends.</h1>
        <p class="intro">Three small habits for keeping useful work in focus, even when the day gets busy.</p>
        <div class="meta">The Fieldnotes journal · 4 minute read</div>
        <div class="article-grid"><article>
          <h2>01. Give incoming tasks one home.</h2>
          <p>A single list gives new requests somewhere to land. Capture the task when it arrives, then return to the work in front of you.</p>
          <h2>02. Put small jobs together.</h2>
          <p>Group routine admin into a short block. Moving between messages, forms and research all day makes each task harder to finish.</p>
          <h2>03. Leave yourself a next step.</h2>
          <p>Before changing projects, write one clear sentence about what comes next. When you return, you already know where to begin.</p>
        </article><aside class="note"><strong>One thing to try</strong>Before you close your current task, write down the very next action.<div class="rule"></div>A little structure makes room for the work that matters.</aside></div>`;
    } else if (fixture.page === 'venues') {
      document.getElementById('site-name').textContent = 'Gather';
      document.getElementById('site-nav').innerHTML = '<span>Spaces</span><span>Saved</span><span>Your shortlist</span>';
      content.innerHTML = `
        <div class="kicker">THE TEAM DAY, PLANNED</div><h1>A good space for a good day.</h1>
        <p class="intro">Your shortlist for a twelve-person planning session.</p>
        <div class="cards">
          <article class="venue"><div class="art"><div class="windows"><i></i><i></i><i></i></div></div><div class="venue-info"><h2>The Atrium</h2><p>16 seats</p><p>Screen included</p><span class="tag">Private room</span></div></article>
          <article class="venue"><div class="art"><div class="windows"><i></i><i></i></div></div><div class="venue-info"><h2>Studio North</h2><p>10 seats</p><p>Screen included</p><span class="tag">Private room</span></div></article>
          <article class="venue"><div class="art"><div class="windows"><i></i><i></i><i></i></div></div><div class="venue-info"><h2>The Garden</h2><p>20 seats</p><p>No screen</p><span class="tag">Shared space</span></div></article>
        </div><div class="checklist"><span>12 people</span><span>Screen needed</span><span>Quiet room</span></div>`;
    } else if (fixture.page === 'form') {
      document.getElementById('site-name').textContent = 'Gather';
      document.getElementById('site-nav').innerHTML = '<span>Spaces</span><span>Sessions</span><span>Your team</span>';
      content.innerHTML = `
        <div class="kicker">MAKE ROOM FOR THE TEAM</div><h1>Plan a team session.</h1>
        <form><div class="form-grid"><label class="full">Session title<input value="Team planning session"></label><label>People<input type="number" value="12"></label><label>Room layout<select><option>Classroom</option><option>Boardroom</option></select></label><label class="full">What do you need?<input value="A screen and a quiet, private room"></label></div><button type="button">Review details</button><p class="form-note">Details stay on this page until you choose to continue.</p></form>`;
    }
    if (fixture.active) {
      // The shipping content script draws the activity state.
      const script = document.createElement('script');
      script.src = '/extension/src/content-scripts/visual-indicator.js';
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
